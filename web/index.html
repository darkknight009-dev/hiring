<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: https://www.gstatic.com https://integrate.api.nvidia.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; manifest-src 'self'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Never miss a hiring post. Your radar watches your feed; you make every move.">
  <meta name="theme-color" content="#24734f">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FeedRadar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>FeedRadar</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f7f8f5; color: #202c25; }
    #boot { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 0 24px; font-family: system-ui, sans-serif; }
    #boot img { margin: 0 auto 20px; border-radius: 14px; }
    #boot h1 { font-size: 24px; letter-spacing: -0.6px; margin: 0 0 12px; }
    #boot p { max-width: 420px; color: #647168; line-height: 1.6; }
    #boot a { color: #24734f; padding: 12px; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121613; color: #e8ece9; }
      #boot p { color: #aab7ae; }
      #boot a { color: #8ed6ae; }
    }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" width="56" height="56" alt="">
    <h1>FeedRadar</h1>
    <p id="boot-status">Tuning your radar…</p>
    <a id="boot-retry" href="" hidden>Reload FeedRadar</a>
  </div>
  <noscript>FeedRadar needs JavaScript enabled to run.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
